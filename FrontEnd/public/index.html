<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LisoFlix - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index3.css">
</head>
<body>
    <div class="background">
        <div class="overlay"></div>
        <div class="login-container">
            <h1 class="marca-login">LisoFlix</h1>
            <h3>Faça login para continuar</h3>

            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="senha" placeholder="Senha" required>

            <button onclick="login()">Entrar</button>
            <button class="btn-visitante" onclick="entrarComoVisitante()">Entrar como visitante</button>
            <button onclick="irParaCadastro()" style="background: #333; margin-top: 10px;">Criar conta</button>

            <p id="mensagem" style="text-align: center; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
