<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LisoFlix - Cadastro</title>
    <meta name="description" content="Crie sua conta gratuita no LisoFlix.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e50914'/%3E%3Cpath d='M38 27 L75 50 L38 73 Z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index3.css">
</head>
<body>
    <div class="background">
        <div class="overlay"></div>

        <div class="login-container">
            <h1 class="marca-login" style="font-size: 30px;">Cadastro LisoFlix</h1>
            
            <input id="usuario" type="text" placeholder="Usuário" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="senha" type="password" placeholder="Senha - 8+ caracteres" required>
            
            <button class="registrar" onclick="registrar()">Cadastrar</button>
            <button class="btn-visitante" onclick="entrarComoVisitante()">Entrar como visitante</button>
            <button class="registrar" onclick="window.location.href='index.html'">Voltar</button>

            <p id="mensagem"></p>

            <h3>Já tem conta? <a href="index.html#entrar" style="color:red;">Fazer login</a></h3>
        </div>
    </div>

    <script src="index2.js"></script>
</body>
</html>
